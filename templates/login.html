<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Med-Core App</title>
    <style>
        /* Estilos mínimos para probar el formulario de login */
        body { font-family: sans-serif; display: flex; justify-content: center;
               align-items: center; min-height: 100vh; margin: 0; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px;
                box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 320px; }
        h1 { margin: 0 0 1.5rem; font-size: 1.4rem; color: #1a1a2e; text-align: center; }
        label { display: block; margin-bottom: .3rem; font-size: .9rem; color: #555; }
        input { width: 100%; padding: .6rem; margin-bottom: 1rem; border: 1px solid #ccc;
                border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: .75rem; background: #4f46e5; color: white;
                 border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #4338ca; }
        .alert { padding: .6rem .8rem; border-radius: 4px; margin-bottom: 1rem; font-size: .9rem; }
        .warning { background: #fff3cd; color: #856404; }
        .danger  { background: #f8d7da; color: #842029; }
        .info    { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Med-Core App</h1>

        <!-- Mostrar mensajes flash (errores, advertencias, etc.) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <!-- Formulario de inicio de sesión -->
        <form method="POST" action="{{ url_for('login_post') }}">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username"
                   placeholder="Tu nombre de usuario" required autofocus>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   placeholder="Tu contraseña" required>

            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
